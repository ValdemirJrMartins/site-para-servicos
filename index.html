<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Orçamentos agendados</title>
  </head>
  <body>
    <div class="container-orcamento">
      <h1>Meus Orçamentos</h1>
      <div class="form-orcamento">
        <label for="nome">Nome do Cliente:</label>
        <input
          type="text"
          id="nomeCliente"
          placeholder="Digite o nome"
          required
        />
      </div>
      <div class="form-orcamento">
        <label for="valor">Valor Cobrado:</label>
        <input
          type="number"
          id="valorCobrado"
          placeholder="Digite o valor"
          required
        />
      </div>

      <button id="btn-cadastrar">Salvar</button>

      <div id="listaOrcamento" class="secao-orcamento"></div>
    </div>
  </body>
</html>
